name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # manual "Run workflow" button

# Needed to push the report to the gh-pages branch
permissions:
  contents: write

# Never run two pipelines on the same branch at once (they would fight over gh-pages)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04     # pinned: "latest" silently changes the OS under the tests
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven          # cache ~/.m2 between runs

      # Gate: regression suite must be 100% green. A red build = a NEW problem.
      - name: Regression tests (without known bugs)
        run: ./mvnw -B clean test -DexcludedGroups=known-bug

      # Reproduce already reported bugs. Failures here are expected and do not fail the build.
      - name: Known bug tests
        if: always()
        run: ./mvnw -B test -Dgroups=known-bug -Dmaven.test.failure.ignore=true

      # ---------- Allure report ----------
      - name: Load report history from gh-pages
        if: always()
        uses: actions/checkout@v5
        continue-on-error: true   # first run: gh-pages does not exist yet
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare Allure results (history + executor)
        if: always()
        run: |
          mkdir -p target/allure-results
          if [ -d gh-pages/history ]; then cp -r gh-pages/history target/allure-results/; fi
          cat > target/allure-results/executor.json <<JSON
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          JSON

      - name: Generate Allure report
        if: always()
        run: ./mvnw -B allure:report

      - name: Upload report as build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      - name: Upload application log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-under-test-log
          path: target/app-under-test.log
          if-no-files-found: ignore

      - name: Publish report to GitHub Pages
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin
          force_orphan: true      # gh-pages keeps only the latest report (history lives inside it)
